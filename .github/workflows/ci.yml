name: CI

on:
  push:
    branches: [ main, master, cleanup ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python tests and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r aiops-engine/requirements.txt -r echo-server/requirements.txt -r traffic-gen/requirements.txt
          python -m pip install pytest bandit pip-audit

      - name: Run tests
        run: |
          pytest -q

      - name: Run secret scanner
        run: |
          python scripts/scan_secrets.py

      - name: Run Bandit
        run: |
          bandit -r aiops-engine echo-server traffic-gen monitoring training scripts

      - name: Run pip-audit
        run: |
          pip-audit -r aiops-engine/requirements.txt -r echo-server/requirements.txt -r traffic-gen/requirements.txt

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build aiops-engine image
        run: docker build --progress=plain -t aiops-engine:ci ./aiops-engine

      - name: Build echo-server image
        run: docker build --progress=plain -t echo-server:ci ./echo-server

      - name: Build traffic-gen image
        run: docker build --progress=plain -t traffic-gen:ci ./traffic-gen
