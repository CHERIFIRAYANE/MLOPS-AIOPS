name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & YAML checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 yamllint

      - name: Run flake8
        run: |
          flake8 --max-line-length=120 || true

      - name: YAML lint (k8s manifests)
        run: |
          yamllint -c <(cat <<'YAML'
          extends: default
          rules:
            line-length: {max: 180}
          YAML
          ) k8s || true

  security:
    name: Static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit (SAST)
        run: |
          bandit -r . || true

      - name: Run pip-audit (dependency vuln check)
        run: |
          pip-audit --progress spinner || true
      - name: Run repository secrets scanner
        run: |
          python scripts/scan_secrets.py || true

  build-images:
    name: Build Docker images (local)
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build aiops-engine image
        run: |
          docker build --progress=plain -t aiops-engine:ci ./aiops-engine

      - name: Build echo-server image
        run: |
          docker build --progress=plain -t echo-server:ci ./echo-server

      - name: Build traffic-gen image
        run: |
          docker build --progress=plain -t traffic-gen:ci ./traffic-gen
