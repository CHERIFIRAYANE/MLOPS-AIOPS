apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: aiops
data:
  aiops-dashboard.json: |
    {
      "title": "AIOps Platform",
      "uid": "aiops-v1",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [

        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "rate(http_requests_total[1m])",
            "legendFormat": "{{method}} {{endpoint}} {{status}}"
          }]
        },

        {
          "id": 2,
          "title": "HTTP p95 / p99 Latency (s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m]))",
              "legendFormat": "p95"
            },
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[1m]))",
              "legendFormat": "p99"
            }
          ]
        },

        {
          "id": 3,
          "title": "HTTP Error Rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "rate(http_requests_total{status=~'5..'}[1m]) / rate(http_requests_total[1m])",
            "legendFormat": "5xx error rate"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.05 },
                  { "color": "red", "value": 0.15 }
                ]
              }
            }
          }
        },

        {
          "id": 4,
          "title": "Echo Server Mode",
          "type": "stat",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            { "datasource": "Prometheus", "expr": "echo_server_mode{mode='normal'}", "legendFormat": "normal" },
            { "datasource": "Prometheus", "expr": "echo_server_mode{mode='slow'}",   "legendFormat": "slow" },
            { "datasource": "Prometheus", "expr": "echo_server_mode{mode='error'}",  "legendFormat": "error" },
            { "datasource": "Prometheus", "expr": "echo_server_mode{mode='cpu'}",    "legendFormat": "cpu" }
          ]
        },

        {
          "id": 10,
          "title": "Anomaly Rate (rolling 60 windows)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "aiops_anomaly_rate_1m",
            "legendFormat": "anomaly rate"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "orange", "value": 0.20 },
                  { "color": "red",    "value": 0.40 }
                ]
              }
            }
          }
        },

        {
          "id": 11,
          "title": "Raw Anomaly Score",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "aiops_avg_anomaly_score",
            "legendFormat": "avg iso score"
          }]
        },

        {
          "id": 12,
          "title": "Feature Drift Score (z-score)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "aiops_feature_drift_score",
            "legendFormat": "drift"
          }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "orange", "value": 2.0 },
                  { "color": "red",    "value": 3.5 }
                ]
              }
            }
          }
        },

        {
          "id": 13,
          "title": "Total Predictions / Anomalies",
          "type": "stat",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [
            { "datasource": "Prometheus", "expr": "aiops_prediction_total", "legendFormat": "Total predictions" },
            { "datasource": "Prometheus", "expr": "aiops_anomaly_total",    "legendFormat": "Total anomalies" }
          ]
        },

        {
          "id": 20,
          "title": "Node CPU Usage (%)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "rate(node_cpu_seconds_total[5m]) * 100",
            "legendFormat": "{{mode}}"
          }]
        },

        {
          "id": 21,
          "title": "Node Memory Available (MB)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "node_memory_MemAvailable_bytes / 1024 / 1024",
            "legendFormat": "available MB"
          }]
        },

        {
          "id": 22,
          "title": "Network Throughput (bytes/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 40, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(node_network_receive_bytes_total[5m])",
              "legendFormat": "rx {{device}}"
            },
            {
              "datasource": "Prometheus",
              "expr": "rate(node_network_transmit_bytes_total[5m])",
              "legendFormat": "tx {{device}}"
            }
          ]
        },

        {
          "id": 23,
          "title": "System Load Average",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 40, "w": 12, "h": 8 },
          "targets": [
            { "datasource": "Prometheus", "expr": "node_load1",  "legendFormat": "load 1m" },
            { "datasource": "Prometheus", "expr": "node_load5",  "legendFormat": "load 5m" },
            { "datasource": "Prometheus", "expr": "node_load15", "legendFormat": "load 15m" }
          ]
        },

        {
          "id": 30,
          "title": "Anomaly Intelligence",
          "type": "row",
          "gridPos": { "x": 0, "y": 48, "w": 24, "h": 1 },
          "collapsed": false
        },

        {
          "id": 31,
          "title": "Last Anomaly Type",
          "type": "stat",
          "gridPos": { "x": 0, "y": 49, "w": 6, "h": 7 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "aiops_last_anomaly_type_id",
            "legendFormat": "type"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [{
                "type": "value",
                "options": {
                  "0": { "text": "Normal",            "color": "green"      },
                  "1": { "text": "DDoS / Traffic Spike", "color": "red"        },
                  "2": { "text": "Slow Response",        "color": "orange"     },
                  "3": { "text": "Error Rate Spike",     "color": "yellow"     },
                  "4": { "text": "CPU Stress",           "color": "dark-red"   },
                  "5": { "text": "Unknown",              "color": "blue"       }
                }
              }],
              "thresholds": {
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "orange", "value": 1    },
                  { "color": "red",    "value": 3    }
                ]
              }
            }
          }
        },

        {
          "id": 32,
          "title": "Root Cause Features (top 3 contributors)",
          "type": "timeseries",
          "gridPos": { "x": 6, "y": 49, "w": 18, "h": 7 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "aiops_last_anomaly_feature_score",
            "legendFormat": "#{{rank}} {{label}}"
          }],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "options": {
            "tooltip": { "mode": "multi" }
          }
        },

        {
          "id": 33,
          "title": "Anomaly Type Over Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 56, "w": 24, "h": 7 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "aiops_last_anomaly_type_id",
            "legendFormat": "anomaly type (0=normal 1=ddos 2=slow 3=error 4=cpu)"
          }],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "fillOpacity": 60, "lineWidth": 0 },
              "mappings": [{
                "type": "value",
                "options": {
                  "0": { "text": "Normal",    "color": "green"  },
                  "1": { "text": "DDoS",      "color": "red"    },
                  "2": { "text": "Slow",      "color": "orange" },
                  "3": { "text": "Errors",    "color": "yellow" },
                  "4": { "text": "CPU",       "color": "dark-red" },
                  "5": { "text": "Unknown",   "color": "blue"   }
                }
              }],
              "thresholds": {
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "orange", "value": 1    },
                  { "color": "red",    "value": 3    }
                ]
              }
            }
          }
        }

      ]
    }
